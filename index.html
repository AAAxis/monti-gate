<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>EasyDeck</title>
    <!--
      Stamps the theme before the first paint. Without this the document renders
      light for the moment it takes React to boot, which reads as a white flash
      when the app is in dark mode. Kept inline and dependency-free on purpose:
      it must run before the stylesheet paints, so it cannot be a module.
      Mirrors resolve() in src/theme.tsx -- keep the storage key in step.
    -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('monti.theme');
          var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark = preference === 'dark' ||
            (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
