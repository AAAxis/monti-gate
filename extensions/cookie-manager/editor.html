<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scout Web Cookie Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <!-- Was a 32px PNG (dark helmet mark on a solid black square) forced
         down to 24px -- at that size it read as a broken-image smudge, not
         a logo. Swapped for an inline SVG cookie glyph in the same outline
         grammar as the toolbar's add/import icons below, colored via
         currentColor so it always matches the header text. -->
    <svg class="app-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8.5 8.5v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M16 15.5v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 12v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11 17v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 14v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Cookie editor</h1>
    <span id="profile-chip" class="chip" hidden></span>
    <span id="summary" class="summary"></span>
  </header>

  <section class="toolbar">
    <input id="search" type="search" placeholder="Search name, value or domain… ( / )" aria-label="Search cookies">
    <select id="domain-filter" aria-label="Filter by domain"><option value="">All domains</option></select>
    <button id="add" type="button">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Add cookie
    </button>
    <button id="delete-selected" type="button" disabled>Delete selected</button>
    <button id="save-as-set-button" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M19 21 12 16l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Save to Cookies tab&hellip;
    </button>
    <div class="menu-wrap">
      <button id="export-menu-button" type="button" aria-haspopup="true" aria-expanded="false">Export ▾</button>
      <div id="export-menu" class="menu" hidden role="menu">
        <button data-format="json" type="button" role="menuitem">JSON file</button>
        <button data-format="netscape" type="button" role="menuitem">Netscape file</button>
        <button data-format="clipboard" type="button" role="menuitem">Copy JSON</button>
      </div>
    </div>
    <label class="import-label" for="import-file">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M7 1v8M3.5 6.5 7 10l3.5-3.5M2 12h10" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Import
      <input id="import-file" type="file" accept=".json,.txt,.cookies">
    </label>
    <div class="menu-wrap danger-wrap">
      <button id="clear-menu-button" class="danger" type="button" aria-haspopup="true" aria-expanded="false">
        Clear ▾
      </button>
      <div id="clear-menu" class="menu" hidden role="menu">
        <button data-scope="domain" type="button" role="menuitem">Clear filtered domain…</button>
        <button data-scope="all" type="button" role="menuitem">Clear ALL cookies…</button>
      </div>
    </div>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="check"><input id="select-all" type="checkbox" aria-label="Select all rows on this page"></th>
          <th>Name</th><th>Value</th><th>Domain</th><th>Path</th>
          <th>Expires</th><th>Flags</th><th class="actions"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p id="empty" class="empty" hidden>No cookies match.</p>

  <footer>
    <span id="page-info"></span>
    <button id="prev" type="button" disabled>‹ Prev</button>
    <button id="next" type="button" disabled>Next ›</button>
    <select id="page-size" aria-label="Rows per page">
      <option>25</option><option selected>50</option><option>100</option>
    </select>
  </footer>

  <dialog id="edit-dialog">
    <form method="dialog" id="edit-form">
      <h2 id="edit-title">Edit cookie</h2>
      <label>Name <input name="name" type="text" required autocomplete="off"></label>
      <label>Value <textarea name="value" rows="3" autocomplete="off"></textarea></label>
      <label>Domain <input name="domain" type="text" placeholder=".example.com" autocomplete="off"></label>
      <label>Path <input name="path" type="text" value="/" autocomplete="off"></label>
      <label>Expires <input name="expires" type="datetime-local"> <small>Empty = session cookie</small></label>
      <div class="flags">
        <label><input name="secure" type="checkbox"> Secure</label>
        <label><input name="httpOnly" type="checkbox"> HttpOnly</label>
        <label>SameSite
          <select name="sameSite">
            <option value="lax">Lax</option>
            <option value="strict">Strict</option>
            <option value="no_restriction">None</option>
            <option value="unspecified">Unspecified</option>
          </select>
        </label>
      </div>
      <div class="dialog-buttons">
        <!-- type="button" on purpose: this form has one submit button (Save),
             so pressing Enter in any field submits it, not this one. -->
        <button id="edit-cancel" class="ghost" type="button">Cancel</button>
        <button value="save" class="primary" id="edit-save" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Same dialog styling as #edit-dialog above. The scope choice is what
       makes this worth two clicks instead of exporting a whole-jar file and
       trimming it by hand: pick exactly what's in front of you (a
       selection), what you searched for (the filter), or everything. -->
  <dialog id="save-as-dialog">
    <form method="dialog" id="save-as-form">
      <h2>Save to Cookies tab</h2>
      <label>Name <input name="name" type="text" maxlength="80" autocomplete="off" required></label>
      <fieldset id="save-as-scope">
        <legend>What to save</legend>
        <label>
          <input type="radio" name="scope" value="selected">
          <span id="scope-selected-label">Selected</span>
        </label>
        <label>
          <input type="radio" name="scope" value="filtered">
          <span id="scope-filtered-label">Current filter</span>
        </label>
        <label>
          <input type="radio" name="scope" value="all">
          <span id="scope-all-label">All cookies</span>
        </label>
      </fieldset>
      <div class="dialog-buttons">
        <button id="save-as-cancel" class="ghost" type="button">Cancel</button>
        <button value="save" class="primary" id="save-as-confirm" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <script src="cookie-format.js"></script>
  <script src="editor.js"></script>
</body>
</html>
